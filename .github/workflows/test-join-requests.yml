name: DolceBot join-request and regression tests
on:
  push:
    branches: [feature/anonymous-questions-to-admins, main]
    paths:
      - 'main.py'
      - 'tests/**'
      - 'dolce_anon.py'
      - '.github/workflows/test-join-requests.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile main.py dolce_anon.py
      - name: Run logic and join request tests
        run: python -m unittest discover -s tests -v
